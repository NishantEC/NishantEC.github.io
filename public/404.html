<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Nishant Gupta</title>
    <meta name="robots" content="noindex" />
    <!--
      A real 404, not a redirect.

      This used to be a GitHub Pages shim: with no server-side rewrite there, a
      direct hit on /stash/x returned this file, so it stashed the path and sent
      the browser to `/` for the router to pick up. On Vercel every real route is
      prerendered to its own file and served directly, so that trick now does the
      opposite of its job — it turns a genuine 404 into a silent homepage hit,
      which hides broken links from you and looks like a soft 404 to a crawler.
    -->
    <style>
      :root { color-scheme: light dark }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #fafaf9; color: #292524;
        font: 16px/1.6 Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) { body { background: #1b1918; color: #f5f5f4 } }
      main { max-width: 28rem; padding: 2rem; text-align: center }
      h1 { margin: 0 0 .5rem; font: italic 400 1.75rem/1.2 "Instrument Serif", Georgia, serif }
      p { margin: 0 0 1.5rem; color: #78716c }
      @media (prefers-color-scheme: dark) { p { color: #a8a29e } }
      a {
        display: inline-block; padding: .55rem 1rem; border-radius: .625rem;
        border: 1px solid currentColor; color: inherit; text-decoration: none; font-size: .875rem;
      }
      a:hover { background: color-mix(in oklch, currentColor 8%, transparent) }
    </style>
  </head>
  <body>
    <main>
      <h1>No route for that</h1>
      <p>The page you asked for isn’t here. It may have moved, or never existed.</p>
      <a href="/">Back to the homepage</a>
    </main>
  </body>
</html>

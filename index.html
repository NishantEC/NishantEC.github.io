<!DOCTYPE html>
<html lang="en" class="scrollbar-thin">
  <head>
    <meta charset="UTF-8" />
    <!-- Circular crop of the profile photo. The .ico carries 16/32/48 resampled
         from the full-resolution source rather than one drawing scaled down. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/title-icon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nishant Gupta • Software Engineer</title>
    <meta
      name="description"
      content="Software engineer in Bangalore. Building product interfaces, and developer tools on the side."
    />
    <link rel="canonical" href="https://www.nishantg.com/" />
    <meta name="theme-color" content="#1b1918" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nishantg.com/" />
    <meta property="og:title" content="Nishant Gupta • Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer in Bangalore. Building product interfaces, and developer tools on the side."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:creator" content="@NishCodes" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nishant Gupta",
        "url": "https://www.nishantg.com/",
        "jobTitle": "Software Engineer",
        "email": "mailto:guptanishant1307@gmail.com",
        "address": { "@type": "PostalPlace", "addressLocality": "Bangalore", "addressCountry": "IN" },
        "worksFor": { "@type": "Organization", "name": "Healthifyme" },
        "sameAs": [
          "https://github.com/NishantEC",
          "https://www.linkedin.com/in/nishantxgupta/",
          "https://x.com/NishCodes"
        ]
      }
    </script>

    <!-- Applies the stored theme before first paint so dark mode never flashes white. -->
    <script>
      (() => {
        const stored = localStorage.getItem('theme');
        const dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
